<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    
    <!-- Ultra Neon Cyan to Indigo to Violet Gradient -->
    <linearGradient id="gBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Glowing Cyber Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Squircle Frame with Neon Edge -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />
  
  <!-- Ambient Core Glow -->
  <circle cx="32" cy="32" r="18" fill="url(#gBrand)" opacity="0.32" filter="url(#glow)" />

  <!-- Bold Geometric Futuristic "G" Monogram (Crystal Clear at 16px/32px) -->
  <path d="M 47 19
           C 42 14.5, 37 13.5, 32 13.5
           C 20 13.5, 13.5 21.5, 13.5 32
           C 13.5 42.5, 20 50.5, 32 50.5
           C 43.5 50.5, 49.5 43, 50 34
           L 32 34" 
        fill="none" 
        stroke="url(#gBrand)" 
        stroke-width="7.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Cyber Pulse Center Core -->
  <circle cx="32" cy="34" r="3.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="32" cy="34" r="1.8" fill="#ffffff" />
</svg>
