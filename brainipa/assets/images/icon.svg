<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="480" height="480" x="16" y="16" rx="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="4" />
  
  <!-- Subtle Internal Grid -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3" stroke-dasharray="8 8" />
  
  <!-- Central Icon (Brain + Heart Glow) -->
  <g filter="url(#glow)">
    <text x="256" y="300" font-size="220" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', sans-serif">🧠</text>
  </g>
  
  <!-- Small Badge Bottom Right -->
  <g transform="translate(340, 340)">
    <circle cx="45" cy="45" r="40" fill="#10B981" stroke="#FFFFFF" stroke-width="6"/>
    <text x="45" y="55" font-size="34" text-anchor="middle" font-family="'Nunito', sans-serif" font-weight="900" fill="#FFFFFF">IPA</text>
  </g>
</svg>
